    renderGradesEditorRows();
    selectDocType('simple');
    applyActiveRolePermissions();
    updateHistoryBadge();
    if (window.lucide) lucide.createIcons();
    updateSyncStatusBadge();
});

function initVaultData() {
    const rawEmbedded = document.getElementById('embeddedInternalVaultData')?.textContent || '{}';
    const embeddedObj = JSON.parse(rawEmbedded);
    defaultTemplatesBackup = JSON.parse(JSON.stringify(embeddedObj.customTemplates || {}));

    // Revisar si viene sincronización por hash URL
    if (window.location.hash && window.location.hash.startsWith('#sync=')) {
        try {
            const b64 = window.location.hash.replace('#sync=', '');
            const decoded = JSON.parse(decodeURIComponent(escape(atob(b64))));
            if (decoded && decoded.profiles) {
                vaultData = decoded;
                persistVaultToStorage(false);
                showToast('Configuración sincronizada cargada desde el enlace.');
                return;
            }
        } catch (e) {
            console.warn('No se pudo leer hash de sincronización:', e);
        }
    }

    // Revisar LocalStorage (respetando perfiles eliminados o modificados permanentemente)
    const savedLocal = localStorage.getItem(STORAGE_KEY);
    if (savedLocal) {
        try {
            const parsed = JSON.parse(savedLocal);
            if (parsed && Array.isArray(parsed.profiles)) {
                const deletedIds = new Set(parsed.deletedProfileIds || []);
                parsed.profiles = parsed.profiles.filter(p => !deletedIds.has(p.id));
                vaultData = parsed;
                return;
            }
        } catch (e) {}
    }

    const deletedEmbedded = new Set(embeddedObj.deletedProfileIds || []);
    embeddedObj.profiles = (embeddedObj.profiles || []).filter(p => !deletedEmbedded.has(p.id));
    vaultData = embeddedObj;
}

function persistVaultToStorage(updateBadge = true) {
    if (!vaultData) return;
    vaultData.updatedAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(vaultData));
    const scriptEl = document.getElementById('embeddedInternalVaultData');
    if (scriptEl) {
        scriptEl.textContent = JSON.stringify(vaultData);
    }
    if (updateBadge) updateSyncStatusBadge();
}

function updateSyncStatusBadge() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const textEl = document.getElementById('liveSaveStatusText');
    if (textEl) textEl.textContent = `Enlace y Base Sincronizados (${timeStr})`;
}

function unlockProfileByQuickAccessCode(event) {
    if (event) event.preventDefault();
    const input = document.getElementById('quickAccessCodeInput');
    const code = (input.value || '').trim().toUpperCase();
    if (!code) {
        showToast('Ingresa un código de acceso válido.');
        return;
    }

    if (code === ADMIN_MASTER_CODE) {
        isSessionLocked = false;
        activeUserRole = 'ADMIN';
        activeProfileObj = null;
        input.value = '';
        applyActiveRolePermissions();
        showToast('Bienvenido, Administrador General (Acceso Total).');
        return;
    }

    const found = (vaultData.profiles || []).find(p => (p.code || '').toUpperCase() === code);
    if (!found) {
        showToast('Código de acceso incorrecto o no registrado.');
        return;
    }

    isSessionLocked = false;
    activeUserRole = found.id;
    activeProfileObj = found;
    input.value = '';
    applyActiveRolePermissions();
    showToast(`Acceso concedido: ${found.name}`);
}

function lockProfileQuickAccess() {
    isSessionLocked = true;
    document.getElementById('appMainContainer').classList.add('hidden');
    document.getElementById('headerWorkspaceTabsBar').classList.add('hidden');
    document.getElementById('lockedHeaderNotice').classList.remove('hidden');

}

function applyActiveRolePermissions() {
    if (isSessionLocked) return;

    document.getElementById('lockedHeaderNotice').classList.add('hidden');
    document.getElementById('appMainContainer').classList.remove('hidden');
    document.getElementById('headerWorkspaceTabsBar').classList.remove('hidden');

    const isAdmin = activeUserRole === 'ADMIN';
    const userLabel = document.getElementById('headerActiveUsername');
    const roleBadge = document.getElementById('headerActiveRoleName');
    const statusDot = document.getElementById('sessionStatusDot');
    const readOnlyAlert = document.getElementById('readOnlyRoleAlert');

    statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';

    if (isAdmin) {
        userLabel.textContent = 'Administrador General';
        roleBadge.textContent = 'ADMIN';
        readOnlyAlert.classList.add('hidden');
        toggleHeaderButtonsVisibility({
            downloadPdf: true, print: true, history: true, excelVault: true,
            periods: true, licenciaturasTab: true, rolesTab: true,
            saveCheckpoint: true, recoverPage: true, restoreDB: true, backupHtml: true,
            quickFolio: true, quickClear: true, quickCopy: true, quickToday: true
        });
        enableAllFormInputs(true);
        return;
    }

    userLabel.textContent = activeProfileObj.name;
    roleBadge.textContent = activeProfileObj.code;

    const perms = activeProfileObj.permissions || {};
    const hb = perms.headerButtons || {};
    toggleHeaderButtonsVisibility(hb);

    // Verificar permisos de modalidades
    const docTypes = ['simple', 'anteriores', 'vacaciones', 'calificaciones', 'kardex', 'montos', 'resguardo'];
    let firstAllowed = null;
    docTypes.forEach(type => {
        const btn = document.getElementById(`btn-type-${type}`);
        const level = perms[type] || 'none';
        if (btn) {
            if (level === 'none') {
                btn.classList.add('hidden');
            } else {
                btn.classList.remove('hidden');
                if (!firstAllowed) firstAllowed = type;
            }
        }
    });

    if ((perms[currentDocType] || 'none') === 'none' && firstAllowed) {
        selectDocType(firstAllowed);
    } else {
        applyFieldLevelPermissionsForCurrentType();
    }
}

function toggleHeaderButtonsVisibility(hb) {

        topBtnPrintConstancia: hb.print !== false,
        topBtnHistory: hb.history !== false,
        physicalVaultBtn: !!hb.excelVault,

        'mainTabBtn-licenciaturas': !!hb.licenciaturasTab,
        'mainTabBtn-roles': !!hb.rolesTab,
        topBtnAdminPortal: !!hb.rolesTab,
        topBtnQuickSaveCheckpoint: !!hb.saveCheckpoint,
        cardBtnSaveCheckpoint: !!hb.saveCheckpoint,
        topBtnRecoverPage: !!hb.recoverPage,
        topBtnRestoreDB: !!hb.restoreDB,
        topBtnBackupPage: !!hb.backupHtml,
        hdrQuickFolioBtn: hb.quickFolio !== false,
        hdrQuickClearBtn: hb.quickClear !== false,
        hdrQuickCopyBtn: hb.quickCopy !== false,
        hdrQuickTodayBtn: hb.quickToday !== false
    };

    Object.entries(map).forEach(([id, visible]) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('hidden', !visible);
    });
}

function selectDocType(type) {
    currentDocType = type;

    // Actualizar estilos botones de modalidad

        btn.classList.remove('border-2', 'border-blue-900', 'bg-blue-50', 'text-blue-950', 'font-semibold');

        activeBtn.classList.add('border-2', 'border-blue-900', 'bg-blue-50', 'text-blue-950', 'font-semibold');

function insertFormatToken(token) {
    const textarea = document.getElementById('customDocFormatText');
    if (textarea.disabled) return;
    const start = textarea.selectionStart;
    const end = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, start) + token + val.substring(end);
    textarea.focus();
    textarea.selectionStart = textarea.selectionEnd = start + token.length;
    onCustomFormatTextareaInput();
}

function toggleSelectedTextBold() {
    const textarea = document.getElementById('customDocFormatText');
    if (document.activeElement === textarea && !textarea.disabled) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        if (start !== end) {
            const selected = textarea.value.substring(start, end);
            const wrapped = selected.startsWith('**') && selected.endsWith('**')
                ? selected.slice(2, -2)
                : `**${selected}**`;
            textarea.value = textarea.value.substring(0, start) + wrapped + textarea.value.substring(end);
            onCustomFormatTextareaInput();
            return;
        }
    }
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {
        document.execCommand('bold', false, null);
        fitContentToSingleLetterSheet();
        return;
    }
    showToast('Selecciona primero texto en la Estructura Completa o en la Hoja.');
}

function toggleSelectedTextUnderline() {
    const textarea = document.getElementById('customDocFormatText');
    if (document.activeElement === textarea && !textarea.disabled) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        if (start !== end) {
            const selected = textarea.value.substring(start, end);
            const wrapped = selected.startsWith('__') && selected.endsWith('__')
                ? selected.slice(2, -2)
                : `__${selected}__`;
            textarea.value = textarea.value.substring(0, start) + wrapped + textarea.value.substring(end);
            onCustomFormatTextareaInput();

    if (sel && sel.rangeCount > 0 && !sel.isCollapsed) {

function applyFontSelectionOrGlobal() {
    const family = document.getElementById('typoFontFamily').value;
    const sel = window.getSelection();
    const previewBody = document.getElementById('documentRenderedBody');

    if (sel && sel.rangeCount > 0 && !sel.isCollapsed && previewBody && previewBody.contains(sel.anchorNode)) {
        const range = sel.getRangeAt(0);
        const span = document.createElement('span');
        span.style.fontFamily = family;
        try {
            range.surroundContents(span);
        } catch (e) {
            const fragment = range.extractContents();
            span.appendChild(fragment);
            range.insertNode(span);
        }
        fitContentToSingleLetterSheet();
        showToast('Tipo de letra aplicado al texto seleccionado.');
        return;
    }

    updateAdminDocTypography(true);
}

function updateDocument() {
    const bodyEl = document.getElementById('documentRenderedBody');
    if (!bodyEl) return;

    const rawTemplate = document.getElementById('customDocFormatText').value || '';
    const folio = document.getElementById('inputFolio').value.trim();
    const asunto = DOC_TYPE_ASUNTOS[currentDocType] || 'CONSTANCIA DE ESTUDIOS';
    const ciudad = document.getElementById('inputCiudad').value.trim().toUpperCase();
    const fechaRaw = document.getElementById('inputFecha').value;
    const fechaMayus = formatSpanishDateUpper(fechaRaw);
    const destinatario = document.getElementById('inputDestinatario').value.trim().toUpperCase();

    const alumno = document.getElementById('inputAlumno').value.trim().toUpperCase();
    const genero = document.getElementById('selectGenero').value;
    const tratamiento = genero === 'F' ? 'la C.' : 'el C.';
    const inscrito = genero === 'F' ? 'inscrita' : 'inscrito';
    const matricula = document.getElementById('inputMatricula').value.trim().toUpperCase();
    const grado = document.getElementById('inputGrado').value.trim().toUpperCase();

    const majorSelect = document.getElementById('selectLicenciatura');
    const licenciatura = majorSelect.options[majorSelect.selectedIndex]?.text || '';
    const rvoe = document.getElementById('inputRvoe').value.trim().toUpperCase();

    const periodSelect = document.getElementById('selectPeriodo');
    const periodo = periodSelect.options[periodSelect.selectedIndex]?.text || '';
    const inicioPeriodo = document.getElementById('inputInicioPeriodo').value.trim().toUpperCase();
    const finPeriodo = document.getElementById('inputFinPeriodo').value.trim().toUpperCase();

    const vacInicio = document.getElementById('inputVacInicio').value.trim().toUpperCase();
    const vacFin = document.getElementById('inputVacFin').value.trim().toUpperCase();
    const periodosAnteriores = document.getElementById('inputPeriodosAnteriores').value.trim();
    const montoInscripcion = document.getElementById('inputMontoInscripcion').value.trim();
    const montoColegiatura = document.getElementById('inputMontoColegiatura').value.trim();
    const documentosResguardo = document.getElementById('inputDocumentosResguardo').value.trim();

    const firmante = document.getElementById('inputFirmante').value.trim().toUpperCase();
    const cargoFirmante = document.getElementById('inputCargoFirmante').value.trim().toUpperCase();

    const tablaHtml = buildGradesTableHtml(currentDocType === 'kardex');

    const replacements = {
        '{FOLIO}': `<strong>${escapeHtml(folio)}</strong>`,
        '{ASUNTO}': `<strong>${escapeHtml(asunto)}</strong>`,
        '{CIUDAD_MAYUS}': escapeHtml(ciudad),
        '{FECHA_MAYUS}': escapeHtml(fechaMayus),
        '{DESTINATARIO}': escapeHtml(destinatario),
        '{TRATAMIENTO}': escapeHtml(tratamiento),
        '{ALUMNO}': `<strong>${escapeHtml(alumno)}</strong>`,
        '{MATRICULA}': `<strong>${escapeHtml(matricula)}</strong>`,
        '{INSCRITO}': escapeHtml(inscrito),
        '{GRADO}': `<strong>${escapeHtml(grado)}</strong>`,
        '{LICENCIATURA}': `<strong>${escapeHtml(licenciatura)}</strong>`,
        '{RVOE}': `<strong>${escapeHtml(rvoe)}</strong>`,
        '{PERIODO}': `<strong>${escapeHtml(periodo)}</strong>`,
        '{INICIO_PERIODO}': `<strong>${escapeHtml(inicioPeriodo)}</strong>`,
        '{FIN_PERIODO}': `<strong>${escapeHtml(finPeriodo)}</strong>`,
        '{VAC_INICIO}': `<strong>${escapeHtml(vacInicio)}</strong>`,
        '{VAC_FIN}': `<strong>${escapeHtml(vacFin)}</strong>`,
        '{PERIODOS_ANTERIORES}': escapeHtml(periodosAnteriores),
        '{MONTO_INSCRIPCION}': `<strong>${escapeHtml(montoInscripcion)}</strong>`,
        '{MONTO_COLEGIATURA}': `<strong>${escapeHtml(montoColegiatura)}</strong>`,
        '{DOCUMENTOS_RESGUARDO}': escapeHtml(documentosResguardo),
        '{FIRMANTE}': `<strong>${escapeHtml(firmante)}</strong>`,
        '{CARGO_FIRMANTE}': `<strong>${escapeHtml(cargoFirmante)}</strong>`,
        '{TABLA}': '___TABLA_PLACEHOLDER___'
    };

    let processed = escapeHtml(rawTemplate);
    // Convertir **texto** en negritas y __texto__ en subrayado
    processed = processed.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    processed = processed.replace(/__(.+?)__/g, '<u>$1</u>');

    Object.entries(replacements).forEach(([token, val]) => {
        processed = processed.split(token).join(val);
    });

    // Dividir en párrafos respetando bloques especiales
    const blocks = processed.split(/\n\s*\n/);
    let htmlOutput = '';

    blocks.forEach((block, idx) => {
        const trimmed = block.trim();
        if (!trimmed) return;

        if (trimmed.includes('___TABLA_PLACEHOLDER___')) {
            const parts = trimmed.split('___TABLA_PLACEHOLDER___');
            if (parts[0].trim()) htmlOutput += `<div class="doc-paragraph">${parts[0].replace(/\n/g, '<br>')}</div>`;
            htmlOutput += tablaHtml;
            if (parts[1] && parts[1].trim()) htmlOutput += `<div class="doc-paragraph">${parts[1].replace(/\n/g, '<br>')}</div>`;
            return;
        }

        // Bloque superior de oficio / fecha
        if (idx === 0 && (trimmed.includes('OFICIO:') || trimmed.includes('ASUNTO:'))) {
            htmlOutput += `<div class="doc-header-block">${trimmed.replace(/\n/g, '<br>')}</div>`;
            return;
        }

        // Bloque destinatario
        if (idx === 1 && trimmed.includes('PRESENTE')) {
            htmlOutput += `<div class="doc-recipient-block">${trimmed.replace(/\n/g, '<br>')}</div>`;
            return;
        }

        // Bloque de firma final
        if (trimmed.startsWith('ATENTAMENTE')) {
            const lines = trimmed.split('\n').map(l => l.trim()).filter(Boolean);
            const atentamente = lines[0] || 'ATENTAMENTE';
            const rest = lines.slice(1).join('<br>');
            htmlOutput += `
                <div class="doc-signature-block">
                    <div style="font-weight: 700;">${atentamente}</div>
                    <div class="doc-signature-line"></div>
                    <div style="line-height: 1.2;">${rest}</div>
                </div>
            `;
            return;
        }

        htmlOutput += `<div class="doc-paragraph">${trimmed.replace(/\n/g, '<br>')}</div>`;
    });

    bodyEl.innerHTML = htmlOutput;
    fitContentToSingleLetterSheet();
}

function fitContentToSingleLetterSheet() {
    const sheet = document.getElementById('officialLetterSheet');
    const smartBox = document.getElementById('docSmartContentBox');
    if (!sheet || !smartBox) return;

    smartBox.style.transform = 'none';
    smartBox.style.width = '100%';

    const style = window.getComputedStyle(sheet);
    const padTop = parseFloat(style.paddingTop) || 0;
    const padBottom = parseFloat(style.paddingBottom) || 0;
    const availableHeight = sheet.clientHeight - padTop - padBottom;
    const contentHeight = smartBox.scrollHeight;

    if (contentHeight > availableHeight && availableHeight > 0) {
        const ratio = Math.max(0.62, availableHeight / contentHeight);
        smartBox.style.transform = `scale(${ratio.toFixed(4)})`;
        smartBox.style.width = `${(100 / ratio).toFixed(2)}%`;
    }
}

// 5. TABLA DE CALIFICACIONES / KARDEX Y DETECCIÓN DE GÉNERO
// =========================================================================
function buildGradesTableHtml(isKardex) {
    if (!gradesList.length) return '';

    const numericGrades = gradesList
        .map(g => parseFloat(String(g.grade).replace(',', '.')))
        .filter(n => !isNaN(n));
    const avg = numericGrades.length
        ? (numericGrades.reduce((a, b) => a + b, 0) / numericGrades.length).toFixed(2)
        : 'N/A';

    if (isKardex) {
        const rows = gradesList.map(g => `
            <tr>
                <td>${escapeHtml(g.period || 'CUATRIMESTRE')}</td>
                <td>${escapeHtml(g.code || '')}</td>
                <td>${escapeHtml(g.subject || '')}</td>
                <td style="text-align:center; font-weight:700;">${escapeHtml(g.grade || '')}</td>
            </tr>
        `).join('');
        return `
            <table class="doc-table kardex-mode">
                <thead>
                    <tr>
                        <th style="width:24%;">Periodo</th>
                        <th style="width:16%;">Clave</th>
                        <th style="width:46%;">Asignatura</th>
                        <th style="width:14%; text-align:center;">Calif.</th>
                    </tr>
                </thead>
                <tbody>
                    ${rows}
                    <tr>
                        <td colspan="3" style="text-align:right; font-weight:700;">PROMEDIO GENERAL ACUMULADO:</td>
                        <td style="text-align:center; font-weight:700;">${avg}</td>
                    </tr>
                </tbody>
            </table>
        `;
    }

    const rows = gradesList.map(g => `
        <tr>

function parseAndReplaceCalificaciones() {
    const raw = (document.getElementById('bulkCalificacionesInput').value || '').trim();
    if (!raw) {
        showToast('Pega o escribe al menos una fila con calificaciones.');
        return;
    }
    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const parsed = [];

    lines.forEach(line => {
        let parts = line.split(/\t|\||;/).map(p => p.trim()).filter(Boolean);
        if (parts.length < 2) {
            parts = line.split(',').map(p => p.trim()).filter(Boolean);
        }
        if (parts.length >= 4) {
            parsed.push({
                group: parts[0].toUpperCase(),
                code: parts[1].toUpperCase(),
                subject: parts[2].toUpperCase(),
                grade: parts[3].toUpperCase(),
                period: 'PERIODO CURSADO'
            });
        } else if (parts.length === 3) {
            parsed.push({
                group: 'U',
                code: parts[0].toUpperCase(),
                subject: parts[1].toUpperCase(),
                grade: parts[2].toUpperCase(),
                period: 'PERIODO CURSADO'
            });
        } else if (parts.length === 2) {
            parsed.push({
                group: 'U',
                code: 'MAT',
                subject: parts[0].toUpperCase(),
                grade: parts[1].toUpperCase(),
                period: 'PERIODO CURSADO'
            });
        }
    });

    if (!parsed.length) {
        showToast('No se pudieron interpretar las filas. Usa formato: GRUPO | CÓDIGO | MATERIA | CALIFICACIÓN.');
        return;
    }

    gradesList = parsed;
    document.getElementById('bulkCalificacionesInput').value = '';
    renderGradesEditorRows();
    updateDocument();
    showToast(`Tabla actualizada con ${parsed.length} asignaturas.`);
}

function detectGenderFromName() {
    const fullName = (document.getElementById('inputAlumno').value || '').trim().toUpperCase();
    const firstWord = fullName.split(/\s+/)[0] || '';
    const sel = document.getElementById('selectGenero');
    if (!firstWord || !sel) return;

    const femaleExceptions = ['MARÍA', 'MARIA', 'GUADALUPE', 'CARMEN', 'ROCÍO', 'ROCIO', 'LUZ', 'PILAR', 'CONSUELO', 'SOCORRO', 'MERCEDES', 'DOLORES', 'ROSARIO', 'BELÉN', 'BELEN', 'ESTHER', 'RUTH', 'ABIGAIL', 'RAQUEL', 'NOEMÍ', 'NOEMI', 'ISABEL', 'LIZBETH', 'YARETZI', 'ARACELI', 'NAYELI', 'CITLALI', 'XOCHITL', 'ITZEL', 'MONSERRAT', 'MONTSERRAT'];
    const maleExceptions = ['JOSÉ', 'JOSE', 'JESÚS', 'JESUS', 'ANGEL', 'ÁNGEL', 'LUIS', 'CARLOS', 'JUAN', 'PEDRO', 'MIGUEL', 'ANTONIO', 'FRANCISCO', 'ALEJANDRO', 'DANIEL', 'DAVID', 'JORGE', 'FERNANDO', 'RICARDO', 'EDUARDO', 'ROBERTO', 'MANUEL', 'RAFAEL', 'ARTURO', 'ENRIQUE', 'OSCAR', 'ÓSCAR', 'HÉCTOR', 'HECTOR', 'VÍCTOR', 'VICTOR', 'ANDRÉS', 'ANDRES', 'ADRIÁN', 'ADRIAN', 'IVÁN', 'IVAN', 'ABRAHAM', 'ISAAC', 'OMAR', 'CÉSAR', 'CESAR', 'EDGAR', 'BRAYAN', 'KEVIN', 'CHRISTIAN', 'CRISTIAN', 'JONATHAN', 'BRANDON', 'ALAN', 'EMMANUEL', 'SAMUEL', 'GABRIEL', 'URIEL', 'SAÚL', 'SAUL', 'RAÚL', 'RAUL', 'RUBÉN', 'RUBEN'];

    if (femaleExceptions.includes(firstWord)) {
        sel.value = 'F';
    } else if (maleExceptions.includes(firstWord)) {
        sel.value = 'M';
    } else if (firstWord.endsWith('A')) {
        sel.value = 'F';
    } else if (firstWord.endsWith('O')) {
        sel.value = 'M';
    }
}

function formatSpanishDateUpper(isoDate) {
    if (!isoDate) return '';
    const parts = isoDate.split('-');
    if (parts.length !== 3) return isoDate.toUpperCase();
    const year = parts[0];
    const monthIdx = parseInt(parts[1], 10) - 1;
    const day = parseInt(parts[2], 10);
    const monthName = MONTHS_ES[monthIdx] || '';
    return `${day} DE ${monthName} DE ${year}`;
}

    if (removed) {
        if (!vaultData.deletedProfileIds) vaultData.deletedProfileIds = [];
        if (!vaultData.deletedProfileIds.includes(removed.id)) {
            vaultData.deletedProfileIds.push(removed.id);
        }
    }
    persistVaultToStorage(true);
    renderProfilesManager();
    showToast('Usuario eliminado permanentemente.');
}

function incrementFolioByOne() {
    const input = document.getElementById('inputFolio');
    const val = input.value;
    const match = val.match(/(\d+)(?!.*\d)/);
    if (match) {
        const numStr = match[1];
        const nextNum = String(parseInt(numStr, 10) + 1).padStart(numStr.length, '0');
        input.value = val.slice(0, match.index) + nextNum + val.slice(match.index + numStr.length);
        updateDocument();
        showToast(`Folio incrementado a ${input.value}`);
    } else {
        showToast('No se detectó número consecutivo en el folio.');
    }
}

function adjustPreviewZoom(delta, reset = false) {
    if (reset) {
        const isFullscreen = document.getElementById('previewSection')?.classList.contains('fullscreen-preview-mode');
        currentZoom = isFullscreen ? 0.96 : 0.78;
    } else {
        currentZoom = Math.min(1.45, Math.max(0.45, currentZoom + delta));
    }
    document.getElementById('previewScaleBox').style.transform = `scale(${currentZoom.toFixed(2)})`;
    document.getElementById('previewZoomLabel').textContent = `${Math.round(currentZoom * 100)}%`;
}

function togglePreviewFullscreen() {
    const previewSec = document.getElementById('previewSection');
    const labelEl = document.getElementById('labelFullscreenPreview');
    if (!previewSec) return;

    const isNowFullscreen = previewSec.classList.toggle('fullscreen-preview-mode');
    if (isNowFullscreen) {
        if (labelEl) labelEl.textContent = 'Salir Pantalla Completa';
        currentZoom = 0.96;
    } else {
        if (labelEl) labelEl.textContent = 'Pantalla Completa';
        currentZoom = 0.78;
    }
    document.getElementById('previewScaleBox').style.transform = `scale(${currentZoom.toFixed(2)})`;
    document.getElementById('previewZoomLabel').textContent = `${Math.round(currentZoom * 100)}%`;
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        const previewSec = document.getElementById('previewSection');
        if (previewSec && previewSec.classList.contains('fullscreen-preview-mode')) {
            togglePreviewFullscreen();
        }
    }
});

function loadTypographyControls() {
    const t = vaultData.typography || { fontFamily: 'Arial, Helvetica, sans-serif', fontSize: 12, lineHeight: 1.15 };
    document.getElementById('typoFontFamily').value = t.fontFamily;
    document.getElementById('typoFontSize').value = t.fontSize;
    document.getElementById('typoLineHeight').value = t.lineHeight;
    updateAdminDocTypography(false);
}

function updateAdminDocTypography(save = true) {
    const family = document.getElementById('typoFontFamily').value;
    const size = parseFloat(document.getElementById('typoFontSize').value);
    const lh = parseFloat(document.getElementById('typoLineHeight').value);

    document.getElementById('typoFontSizeVal').textContent = `${size}pt`;
    document.getElementById('typoLineHeightVal').textContent = lh.toFixed(2);

    const bodyEl = document.getElementById('documentRenderedBody');
    bodyEl.style.fontFamily = family;
    bodyEl.style.setProperty('--doc-font-family', family);
    bodyEl.style.setProperty('--doc-font-size', `${size}pt`);
    bodyEl.style.setProperty('--doc-line-height', lh);

    if (save) {
        vaultData.typography = { fontFamily: family, fontSize: size, lineHeight: lh };
        persistVaultToStorage();
    }
    fitContentToSingleLetterSheet();
}

function resetAdminDocTypography() {
    vaultData.typography = { fontFamily: 'Arial, Helvetica, sans-serif', fontSize: 12, lineHeight: 1.15 };

    persistVaultToStorage();

async function saveAndDownloadConstanciaPDF() {
    saveToHistoryRecord();
    showToast('Generando archivo PDF oficial con la tipografía exacta...');

    const sheet = document.getElementById('officialLetterSheet');
    const bodyEl = document.getElementById('documentRenderedBody');
    const scaleBox = document.getElementById('previewScaleBox');
    const prevTransform = scaleBox.style.transform;
    scaleBox.style.transform = 'none';

    const activeFont = document.getElementById('typoFontFamily').value || 'Arial, Helvetica, sans-serif';
    bodyEl.style.fontFamily = activeFont;
    fitContentToSingleLetterSheet();

    try {
        await document.fonts.ready;
        const canvas = await html2canvas(sheet, {
            scale: 2.5,
            useCORS: true,
            backgroundColor: '#ffffff',
            onclone: (clonedDoc) => {
                const clonedBody = clonedDoc.getElementById('documentRenderedBody');
                if (clonedBody) {
                    clonedBody.style.fontFamily = activeFont;
                }
            }
        });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
        pdf.addImage(imgData, 'PNG', 0, 0, 215.9, 279.4);

        const alumno = (document.getElementById('inputAlumno').value || 'CONSTANCIA').replace(/\s+/g, '_');
        const folio = (document.getElementById('inputFolio').value || 'UAP').replace(/[\/\\]/g, '-');
        pdf.save(`${folio}_${alumno}.pdf`);
        showToast('Constancia guardada en historial y descargada en PDF.');
    } catch (err) {
        console.error(err);
        showToast('Error al generar PDF. Puedes usar el botón Imprimir -> Guardar como PDF.');
    } finally {
        scaleBox.style.transform = prevTransform;
    }
}

function importStudentsExcel(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet);
        if (!rows.length) {
            showToast('El archivo Excel está vacío.');
            return;
        }
        importedStudentsList = rows;
        const sel = document.getElementById('selectImportedStudent');
        sel.innerHTML = rows.map((r, i) => {
            const nombre = r.ALUMNO || r.NOMBRE || r.Alumno || `Registro ${i + 1}`;
            const mat = r.MATRICULA || r.Matricula || '';
            return `<option value="${i}">${escapeHtml(mat)} - ${escapeHtml(nombre)}</option>`;
        }).join('');
        document.getElementById('loadedStudentsBox').classList.remove('hidden');
        applyImportedStudent(0);
        showToast(`Se cargaron ${rows.length} alumnos desde Excel.`);
    };
    reader.readAsArrayBuffer(file);
}

function applyImportedStudent(idx) {
    const row = importedStudentsList[idx];
    if (!row) return;
    if (row.ALUMNO || row.NOMBRE) {
        document.getElementById('inputAlumno').value = String(row.ALUMNO || row.NOMBRE).toUpperCase();
        detectGenderFromName();
    }
    if (row.MATRICULA) document.getElementById('inputMatricula').value = String(row.MATRICULA).toUpperCase();
    if (row.GRADO) {
        const gradoSelect = document.getElementById('inputGrado');
        const gradoVal = String(row.GRADO).trim().toUpperCase();
        const exists = Array.from(gradoSelect.options).some(opt => opt.value === gradoVal);
        if (!exists && gradoVal) {
            const opt = document.createElement('option');
            opt.value = gradoVal;
            opt.textContent = gradoVal;
            gradoSelect.appendChild(opt);
        }
        gradoSelect.value = gradoVal;
    }
    if (row.LICENCIATURA) {
        const target = String(row.LICENCIATURA).toUpperCase();
        const found = (vaultData.majors || []).find(m => m.name.includes(target) || target.includes(m.name));
        if (found) {
            document.getElementById('selectLicenciatura').value = found.id;
            onSelectMajor();
        }
    }
    updateDocument();
}

function exportHistoryToExcel() {
    const hist = vaultData.history || [];
    if (!hist.length) {
        showToast('No hay historial para exportar.');
        return;
    }
    const ws = XLSX.utils.json_to_sheet(hist);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Historial_Constancias');
    XLSX.writeFile(wb, 'Historial_Constancias_UAP.xlsx');
    showToast('Historial exportado a Excel (.xlsx).');
}

function recoverPageEmergencyState() {
    const raw = localStorage.getItem(STORAGE_KEY + '_checkpoint');
    if (!raw) {
        showToast('No hay un punto de guardado previo disponible.');
        return;
    }
    try {
        const cp = JSON.parse(raw);
        if (cp.folio) document.getElementById('inputFolio').value = cp.folio;
        if (cp.ciudad) document.getElementById('inputCiudad').value = cp.ciudad;
        if (cp.fecha) document.getElementById('inputFecha').value = cp.fecha;
        if (cp.destinatario) document.getElementById('inputDestinatario').value = cp.destinatario;
        if (cp.alumno) document.getElementById('inputAlumno').value = cp.alumno;
        if (cp.genero) document.getElementById('selectGenero').value = cp.genero;
        if (cp.matricula) document.getElementById('inputMatricula').value = cp.matricula;
        if (cp.grado) {
            const gradoSelect = document.getElementById('inputGrado');
            const gradoVal = String(cp.grado).trim().toUpperCase();
            const exists = Array.from(gradoSelect.options).some(opt => opt.value === gradoVal);
            if (!exists && gradoVal) {
                const opt = document.createElement('option');
                opt.value = gradoVal;
                opt.textContent = gradoVal;
                gradoSelect.appendChild(opt);
            }
            gradoSelect.value = gradoVal;
        }
        if (cp.licenciatura) document.getElementById('selectLicenciatura').value = cp.licenciatura;
        if (cp.rvoe) document.getElementById('inputRvoe').value = cp.rvoe;
        if (cp.periodo) document.getElementById('selectPeriodo').value = cp.periodo;
        if (cp.inicioPeriodo) document.getElementById('inputInicioPeriodo').value = cp.inicioPeriodo;
        if (cp.finPeriodo) document.getElementById('inputFinPeriodo').value = cp.finPeriodo;
        if (cp.firmante) document.getElementById('inputFirmante').value = cp.firmante;
        if (cp.cargoFirmante) document.getElementById('inputCargoFirmante').value = cp.cargoFirmante;
        if (Array.isArray(cp.gradesList)) {
            gradesList = cp.gradesList;
            renderGradesEditorRows();
        }
        if (cp.currentDocType) selectDocType(cp.currentDocType);
        updateDocument();
        showToast('Página recuperada al último punto guardado.');
    } catch (e) {
        showToast('No se pudo restaurar el punto de guardado.');
    }
}

function downloadSelfContainedPageWithData() {
    const html = buildUpdatedFullHtmlSource();

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Generador_Constancias_UAP_Actualizado.html';
    a.click();
    URL.revokeObjectURL(url);
    showToast('Archivo HTML actualizado descargado.');
}

let toastTimeout = null;
function showToast(msg) {
    const el = document.getElementById('toastNotification');
    const txt = document.getElementById('toastMessageText');
    if (!el || !txt) return;
    txt.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        el.classList.add('hidden');
    }, 3200);
}

function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, '&#39;');
}
